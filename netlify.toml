[build]
command = 'sh scripts/build-course-media.sh && hugo'
publish = 'public'

[build.environment]
HUGO_VERSION = '0.120.4'

[context]
[context.branch-deploy]
command = 'sh scripts/build-course-media.sh && hugo -F -b $DEPLOY_PRIME_URL'

[context.deploy-preview]
command = 'sh scripts/build-course-media.sh && hugo -F -b $DEPLOY_PRIME_URL'

[context.production]
[context.production.environment]
HUGO_ENV = 'production'
