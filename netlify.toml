[build]
command = 'sh scripts/build-course-media.sh && hugo'
publish = 'public'

[build.environment]
HUGO_VERSION = '0.120.4'

[context]
[context.branch-deploy]
command = 'sh scripts/build-course-media.sh && hugo -F -b $DEPLOY_PRIME_URL'

[context.deploy-preview]
command = 'sh scripts/build-course-media.sh && hugo -F -b $DEPLOY_PRIME_URL'

[context.production]
[context.production.environment]
HUGO_ENV = 'production'

# Keep older shared GFuNK PDF links on the current arXiv version.
[[redirects]]
from = "/files/papers/gfunk-v2.pdf"
to = "https://arxiv.org/pdf/2410.04655"
status = 301
force = true
