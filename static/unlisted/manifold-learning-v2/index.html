</style></head><body><main><header><h1>Distance from data.</h1><span class="meta">ZAN AHMAD / MANIFOLD LAB · V2</span></header><nav class="steps" aria-label="Lesson"><button data-step="0" aria-current="step">01 · The data</button><button data-step="1">02 · The surface</button><button data-step="2">03 · The metric</button><button data-step="3">04 · The graph</button></nav><div class="headline"><h2 id="title"></h2><span class="counter" id="counter"></span></div><div class="stage"><div class="legend" id="legend"></div><canvas id="view" role="img" aria-label="Synthetic rolled strip with highlighted points and paths"></canvas><span class="hint">Drag to rotate · synthetic data</span></div><div class="equation" id="equation" aria-live="polite"></div><div class="controls"><div class="group" id="dataControls"><button class="primary" id="reveal">Reveal the surface route</button></div><div class="group" id="surfaceControls" hidden><button class="primary" id="animate">Unfold</button><label>Unfold <output id="foldValue">0%</output><input type="range" id="fold" min="0" max="1" step=".01" value="0"></label><label>Move point B along the strip <input type="range" id="endpoint" min=".05" max=".95" step=".005" value=".7"></label></div><div class="group" id="metricControls" hidden><label>Probe position <output id="probeValue"></output><input type="range" id="probe" min=".03" max=".97" step=".005" value=".5"></label></div><div class="group" id="graphControls" hidden><label>Nearest neighbors <output id="neighborsValue">12</output><input type="range" id="neighbors" min="2" max="32" step="1" value="12"></label><label>Samples <output id="countValue">600</output><input type="range" id="count" min="120" max="600" step="60" value="600"></label></div></div><p id="note"></p><footer><span></span><div class="navend"><button id="back">← Back</button><button id="next">Next →</button></div></footer></main><script src="vendor/katex.min.js"></script><script src="swiss-roll.js"></script><script>
'use strict';const $=id=>document.getElementById(id),G=RollGeometry,T=Math.PI,C={mint:'#9ee4c1',blue:'#9abefc',amber:'#ffbf85',pink:'#e3abc7',violet:'#c1acf0',ink:'#e8e9e0',sub:'#b5b7ac'};
const S={step:0,A:{theta:1.8*T,z:-.7},B:{theta:3.8*T,z:.7},fold:0,probe:.5,reveal:false,count:600,neighbors:12,yaw:.35,playing:false};let graph,curve=[],points=[],frame=0,start=0,from=0,to=1,trace=0;
const headlines=['Close in space can mean far along the data.','Straighten the surface. Keep its distances.','A metric turns a tiny step into a length.','Local links estimate distance. Long links can shortcut.'];
function rebuildGraph(){graph=G.buildGraph({count:S.count,neighbors:S.neighbors,A:S.A,B:S.B,seed:42});points=graph.samples;}
function buildCurve(){const n=500,L=G.arcLength,q=1-S.fold,phi0=G.thetaMin+Math.atan(G.thetaMin);curve=[{x:0,y:0}];for(let i=1;i<=n;i++){const s=(i-.5)*L/n,th=G.inverse(s),phi=q*(th+Math.atan(th)-phi0),last=curve[i-1];curve.push({x:last.x+Math.cos(phi)*L/n,y:last.y+Math.sin(phi)*L/n})}const minX=Math.min(...curve.map(p=>p.x)),maxX=Math.max(...curve.map(p=>p.x)),minY=Math.min(...curve.map(p=>p.y)),maxY=Math.max(...curve.map(p=>p.y));curve.forEach(p=>{p.x-=(minX+maxX)/2;p.y-=(minY+maxY)/2})}
function position(p){let f=G.arc(p.theta)/G.arcLength*(curve.length-1),i=Math.min(curve.length-2,Math.floor(f)),t=f-i;return{x:curve[i].x*(1-t)+curve[i+1].x*t,y:curve[i].y*(1-t)+curve[i+1].y*t,z:p.z}}
function draw(){buildCurve();const canvas=$('view'),rect=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;canvas.width=w*d;canvas.height=h*d;const ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);let yaw=S.yaw*(1-S.fold),cs=Math.cos(yaw),sn=Math.sin(yaw);const raw=p=>({x:p.x*cs-p.y*sn,y:-p.z+.42*(p.x*sn+p.y*cs)});let bounds=curve.flatMap(p=>[raw({...p,z:-2}),raw({...p,z:2})]),xmin=Math.min(...bounds.map(p=>p.x)),xmax=Math.max(...bounds.map(p=>p.x)),ymin=Math.min(...bounds.map(p=>p.y)),ymax=Math.max(...bounds.map(p=>p.y));const scale=Math.min((w-90)/(xmax-xmin),(h-70)/(ymax-ymin)),project=p=>{const q=raw(position(p));return{x:w/2+(q.x-(xmin+xmax)/2)*scale,y:h/2+(q.y-(ymin+ymax)/2)*scale}};
function path(ps,color,width=2,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ps.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([])}
function dot(p,color,r=4,label=''){const q=project(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y,r,0,T*2);ctx.fill();if(label){ctx.font='13px -apple-system,sans-serif';ctx.fillStyle=C.ink;ctx.fillText(label,q.x+10,q.y-9)}}
const ps=fn=>Array.from({length:181},(_,i)=>fn(i/180));
if(S.step===1||S.step===2||S.reveal){ctx.globalAlpha=.14;for(let i=0;i<=20;i++){let th=G.inverse(G.arcLength*i/20);path([{theta:th,z:-2},{theta:th,z:2}],C.sub,1)}for(let z=-2;z<=2;z+=.5)path(ps(t=>({theta:G.inverse(G.arcLength*t),z})),C.sub,1);ctx.globalAlpha=1}
if(S.step===3){ctx.globalAlpha=.12;for(const e of graph.edges)path([points[e[0]],points[e[1]]],C.sub,.7);ctx.globalAlpha=1}
ctx.globalAlpha=S.step===2?.16:S.step===1?.3:.8;for(const p of points)dot(p,C.blue,S.step===3?1.7:2);ctx.globalAlpha=1;
if(S.step!==2){if(S.step===0)path([S.A,S.B],C.pink,2,[5,5]);if(S.reveal||S.step===1||S.step===3)path(ps(t=>G.geodesic(S.A,S.B,t)),C.mint,3);if(S.step===3&&graph.path.length)path(graph.path.map(i=>points[i]),C.violet,3);dot(S.A,C.ink,5,'A');dot(S.B,C.ink,5,'B')}
if(S.step===2){const th=G.inverse(S.probe*G.arcLength),p={theta:th,z:0},delta=.2;path(ps(t=>({theta:Math.min(G.thetaMax,Math.max(G.thetaMin,th+(t-.5)*delta*2)),z:0})),C.blue,4);path([{theta:th,z:-.4},{theta:th,z:.4}],C.amber,4);dot(p,C.ink,5);const q=project(p);ctx.font='14px Georgia';ctx.fillStyle=C.blue;ctx.fillText('dθ',q.x+15,q.y+20);ctx.fillStyle=C.amber;ctx.fillText('dz',q.x-24,q.y-26)}
}
const tex=(s)=>{const root=$('equation');root.replaceChildren();s.split('\\qquad').forEach(part=>{const el=document.createElement('span');root.append(el);katex.render(part,el,{throwOnError:true,displayMode:true,output:'htmlAndMathml'})})};
function update(){const dist=G.distance(S.A,S.B),chord=G.chord(S.A,S.B);$('title').textContent=headlines[S.step];$('counter').textContent=S.step===3?S.count+' observations':S.step===2?'Known surface · induced metric':'2D surface in 3D';
if(S.step===0){tex(String.raw`\color{#e3abc7}{d_E(A,B)}=\|X_A-X_B\|_2=${chord.toFixed(2)}`+(S.reveal?String.raw`\qquad\color{#9ee4c1}{d_M(A,B)}=${dist.toFixed(2)}`:''));$('legend').innerHTML='<span class="pink">Ambient chord</span>'+(S.reveal?'<span>Surface route</span>':'');$('note').textContent=S.reveal?'The short chord cuts between layers. A path constrained to the data must travel around.':'These points lie on different turns of one synthetic strip. Which route stays on the surface?'}
if(S.step===1){tex(String.raw`\color{#9ee4c1}{d_M(A,B)}=\sqrt{(\Delta s)^2+(\Delta z)^2}=${dist.toFixed(2)}`);$('legend').innerHTML='<span>Exact surface geodesic</span>';$('note').textContent='The known arc-length coordinate s makes the surface flat. This is a reference map, not a learned embedding.'}
if(S.step===2){const th=G.inverse(S.probe*G.arcLength),g=G.a*G.a*(1+th*th);tex(String.raw`ds^2=\underbrace{a^2(1+\theta^2)}_{${g.toFixed(2)}}\color{#9abefc}{d\theta^2}+\color{#ffbf85}{dz^2}`);$('legend').innerHTML='<span class="blue">Angular step dθ</span><span class="amber">Height step dz</span>';$('probeValue').textContent='θ = '+(th/T).toFixed(2)+'π';$('note').textContent='The same small angular step costs more on the outer turns. Adding these local lengths measures a path.'}
if(S.step===3){const gd=graph.distance;tex(String.raw`\color{#c1acf0}{d_G}=\min_{P:A\to B}\sum_{(i,j)\in P}\|X_i-X_j\|_2`);$('legend').innerHTML='<span>Exact surface: '+dist.toFixed(2)+'</span><span class="violet">Graph: '+(Number.isFinite(gd)?gd.toFixed(2):'disconnected')+'</span>';$('note').textContent=Number.isFinite(gd)?'Graph − surface = '+(gd-dist).toFixed(2)+'. '+(gd<dist?'Cross-layer chords create a shortcut.':'The graph takes a detour.')+' This is the distance step of Isomap, not a full embedding.':'The graph disconnects A from B. Increase the neighborhood size.'}
$('fold').value=S.fold;$('foldValue').textContent=Math.round(S.fold*100)+'%';$('animate').textContent=S.playing?'Pause':S.fold>.5?'Roll up':'Unfold';$('neighborsValue').textContent=S.neighbors;$('countValue').textContent=S.count;$('reveal').textContent=S.reveal?'Hide the surface route':'Reveal the surface route';draw();}
function stop(){S.playing=false;cancelAnimationFrame(frame)}
function setStep(i){stop();S.step=i;S.fold=0;document.querySelectorAll('[data-step]').forEach((b,j)=>j===i?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));['data','surface','metric','graph'].forEach((n,j)=>$(n+'Controls').hidden=j!==i);$('back').disabled=i===0;$('next').disabled=i===3;rebuildGraph();update()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStep(+b.dataset.step));$('back').onclick=()=>setStep(Math.max(0,S.step-1));$('next').onclick=()=>setStep(Math.min(3,S.step+1));$('reveal').onclick=()=>{S.reveal=!S.reveal;update()};$('fold').oninput=e=>{stop();S.fold=+e.target.value;update()};$('probe').oninput=e=>{S.probe=+e.target.value;update()};$('endpoint').value=G.arc(S.B.theta)/G.arcLength;$('endpoint').oninput=e=>{S.B.theta=G.inverse(+e.target.value*G.arcLength);rebuildGraph();update()};['neighbors','count'].forEach(n=>$(n).oninput=e=>{S[n]=+e.target.value;rebuildGraph();update()});
function tick(now){const t=Math.min(1,(now-start)/2800),ease=t*t*(3-2*t);S.fold=from+(to-from)*ease;$('fold').value=S.fold;$('foldValue').textContent=Math.round(S.fold*100)+'%';draw();if(t<1)frame=requestAnimationFrame(tick);else{S.playing=false;update()}}
$('animate').onclick=()=>{if(S.playing){stop();update();return}from=S.fold;to=S.fold<.5?1:0;if(matchMedia('(prefers-reduced-motion:reduce)').matches){S.fold=to;update();return}S.playing=true;start=performance.now();$('animate').textContent='Pause';frame=requestAnimationFrame(tick)};
let drag=false,x0=0;$('view').onpointerdown=e=>{drag=true;x0=e.clientX;$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(drag){S.yaw+=(e.clientX-x0)*.008;x0=e.clientX;draw()}};$('view').onpointerup=()=>drag=false;$('view').onpointercancel=()=>drag=false;new ResizeObserver(()=>draw()).observe($('view'));rebuildGraph();update();window.rollLab={state:S,setStep,update,graph:()=>graph};
</script></body></html>
