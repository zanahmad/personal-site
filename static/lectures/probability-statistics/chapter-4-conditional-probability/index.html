<style>
:root{color-scheme:dark;--bg:#081521;--ink:#f4f7fb;--muted:#afc1cf;--blue:#5ab0f2;--magenta:#f07aa5;--teal:#5fd4c5;--gold:#f4c95d;--ice:#b3ddff;--line:#3a586c;--panel:#102638}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,system-ui,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
#viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}#slide{position:relative;flex:none;width:1600px;height:900px;transform-origin:center center;background:var(--bg);overflow:hidden}
.eyebrow{position:absolute;left:82px;top:55px;font-size:24px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}.title{position:absolute;left:82px;top:100px;right:80px;font-size:52px;font-weight:650;line-height:1.12}.rule{position:absolute;left:82px;right:82px;top:179px;height:2px;background:#29465b}.sub{position:absolute;left:83px;top:199px;right:83px;font-size:28px;color:var(--muted);line-height:1.35}
.at{position:absolute}.body{font-size:36px;line-height:1.36}.small{font-size:28px;line-height:1.35}.tiny{font-size:23px;line-height:1.3}.math{font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}.eq{font:46px/1.22 Georgia,"Times New Roman",serif}.eq.big{font-size:55px}.muted{color:var(--muted)}.blue{color:var(--blue)}.magenta{color:var(--magenta)}.teal{color:var(--teal)}.gold{color:var(--gold)}.ice{color:var(--ice)}.white{color:var(--ink)}.strong{font-weight:700}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .75s cubic-bezier(.2,.7,.1,1)}.reveal.on{opacity:1;transform:translateY(0)}.fadeaway{transition:opacity .75s ease,transform .75s ease}.focus{filter:drop-shadow(0 0 8px #f4c95d88)}.line{height:2px;background:var(--line)}.vline{width:2px;background:var(--line)}
.formula{display:inline-block;padding:18px 25px;border:2px solid var(--gold);border-radius:8px;background:#101f2e}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.06;margin:0 .16em}.fraction .num{border-bottom:2px solid currentColor;padding:0 .14em .1em}.fraction .den{padding-top:.1em}.question{font-size:49px;line-height:1.25;font-weight:600}.bar{height:24px;border-radius:12px;background:#223d50;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);width:0;transition:width 1.1s ease}
.sum{display:inline-block;position:relative;vertical-align:middle;width:70px;height:94px;margin:0 .13em}.sumtop{position:absolute;left:31px;top:0;font:20px/1 Georgia,serif}.sumsymbol{position:absolute;left:5px;top:16px;font:52px/1 Georgia,serif}.sumbottom{position:absolute;left:15px;bottom:0;font:19px/1 Georgia,serif}
.p5-expanded{font:35px/1.36 Georgia,"Times New Roman",serif;white-space:nowrap}
svg{overflow:visible}.svglabel{font:30px "Avenir Next",Avenir,sans-serif;fill:var(--ink)}.svgsmall{font:24px "Avenir Next",Avenir,sans-serif;fill:var(--muted)}.svgmath{font:38px Georgia,serif;fill:var(--ink)}.region{transition:opacity .7s ease,transform .8s ease;transform-box:fill-box;transform-origin:center}
#controls{height:54px;flex:none;display:flex;gap:10px;align-items:center;border-top:1px solid #2c4b60;padding:0 15px;background:#0a1a28;font:16px system-ui,sans-serif}button,input{font:inherit;color:var(--ink);background:#173044;border:1px solid #456378;border-radius:4px;padding:6px 10px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}#counter{font-variant-numeric:tabular-nums;min-width:105px}#chapterName{margin-left:auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#notes{position:fixed;right:20px;top:20px;width:min(560px,40vw);max-height:75vh;overflow:auto;padding:24px 28px;background:#102638f2;border:1px solid #587086;box-shadow:0 16px 50px #0009;border-radius:9px;font:21px/1.48 system-ui,sans-serif;z-index:4}#notes h2{font-size:24px;margin:0 0 10px}#notes p{margin:.5em 0}#notes[hidden]{display:none}dialog{color:var(--ink);background:#102638;border:1px solid var(--line);border-radius:8px;font:18px/1.5 system-ui,sans-serif}dialog::backdrop{background:#000a}
.grid-frame{position:absolute;left:170px;top:270px;width:575px;height:575px;border:3px solid #9db3c1;overflow:hidden;background:#233745}.grid-frame .base,.grid-frame .disease,.grid-frame .tp,.grid-frame .fp,.grid-frame .gridlines{position:absolute;inset:0}.grid-frame .base{background:#2d4758}.grid-frame .disease{width:1%;right:auto;background:#5ab0f2;opacity:0;transition:opacity .7s}.grid-frame .tp{width:1%;height:90%;right:auto;bottom:auto;background:#f4c95d;opacity:0;transition:opacity .8s}.grid-frame .fp{left:1%;top:0;width:99%;height:5%;bottom:auto;right:auto;background:#f07aa5;opacity:0;transition:opacity .8s}.grid-frame .gridlines{background-image:linear-gradient(to right,#08152191 1px,transparent 1px),linear-gradient(to bottom,#08152191 1px,transparent 1px);background-size:1% 1%;pointer-events:none}
.legendline{display:flex;align-items:center;gap:14px;margin-bottom:19px;font-size:29px}.swatch{width:27px;height:27px;border-radius:3px;display:inline-block;flex:none}
.venn-wrap{position:absolute;left:145px;top:288px;width:710px;height:480px}.venn-wrap svg{width:100%;height:100%}.venn-focus{opacity:0;transition:opacity .8s}.venn-lens{opacity:0;transition:opacity .8s}.venn-Aout{opacity:1;transition:opacity .8s}.venn-oldS{opacity:1;transition:opacity .8s}
#slide[data-scene="conditional"][data-step="1"] .venn-focus,#slide[data-scene="conditional"][data-step="2"] .venn-focus,#slide[data-scene="conditional"][data-step="3"] .venn-focus,#slide[data-scene="conditional"][data-step="4"] .venn-focus{opacity:1}
#slide[data-scene="conditional"][data-step="2"] .venn-lens,#slide[data-scene="conditional"][data-step="3"] .venn-lens,#slide[data-scene="conditional"][data-step="4"] .venn-lens{opacity:1}
#slide[data-scene="conditional"][data-step="1"] .venn-Aout,#slide[data-scene="conditional"][data-step="2"] .venn-Aout,#slide[data-scene="conditional"][data-step="3"] .venn-Aout,#slide[data-scene="conditional"][data-step="4"] .venn-Aout{opacity:.18}
#slide[data-scene="conditional"][data-step="1"] .venn-oldS,#slide[data-scene="conditional"][data-step="2"] .venn-oldS,#slide[data-scene="conditional"][data-step="3"] .venn-oldS,#slide[data-scene="conditional"][data-step="4"] .venn-oldS{opacity:.2}
.strip{transition:fill .8s,opacity .8s,transform .8s}.partition-highlight{opacity:0;transition:opacity .7s}.partition-piece{opacity:0;transition:opacity .6s}.case-name{transition:opacity .5s}
.five-case,.two-case{transition:opacity .8s ease,transform .8s ease}.two-case{opacity:0;transform:scale(.93)}#slide[data-scene="partition5"][data-step="4"] .five-case{opacity:0;transform:scale(.93)}#slide[data-scene="partition5"][data-step="4"] .two-case{opacity:1;transform:scale(1)}
#slide[data-scene="partition5"][data-step="4"] .two-case .partition-piece{opacity:1}
.piece5{opacity:0;transition:opacity .52s ease}#slide[data-scene="partition5"][data-step="1"] .piece5,#slide[data-scene="partition5"][data-step="2"] .piece5,#slide[data-scene="partition5"][data-step="3"] .piece5{opacity:1}#slide[data-scene="partition5"][data-step="4"] .five-explain,#slide[data-scene="partition2"][data-step="4"] .p2-prior{opacity:0;transform:translateY(-10px)}
#slide[data-scene="payoff"][data-step="5"] .payoff-context,#slide[data-scene="payoff"][data-step="6"] .payoff-context{opacity:0;transform:translateY(-12px)}
#slide[data-scene="payoff"][data-step="5"] .payoff-sum{transition-delay:.7s}
.sweep{animation:sweep .85s cubic-bezier(.2,.7,.1,1) both}@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}.pop{animation:pop .7s cubic-bezier(.1,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.chain-C,.chain-BC,.chain-ABC{opacity:0;transition:opacity .8s ease}#slide[data-scene="chain"][data-step="1"] .chain-C,#slide[data-scene="chain"][data-step="2"] .chain-C,#slide[data-scene="chain"][data-step="3"] .chain-C,#slide[data-scene="chain"][data-step="4"] .chain-C,#slide[data-scene="chain"][data-step="5"] .chain-C{opacity:1}#slide[data-scene="chain"][data-step="2"] .chain-BC,#slide[data-scene="chain"][data-step="3"] .chain-BC,#slide[data-scene="chain"][data-step="4"] .chain-BC,#slide[data-scene="chain"][data-step="5"] .chain-BC{opacity:1}#slide[data-scene="chain"][data-step="3"] .chain-ABC,#slide[data-scene="chain"][data-step="4"] .chain-ABC,#slide[data-scene="chain"][data-step="5"] .chain-ABC{opacity:1}
.count-grid .cell{fill:#304758;stroke:#9aafbd;stroke-width:1.2;transition:fill .55s ease,stroke-width .55s ease}#slide[data-scene="multiply"][data-step="1"] .countB,#slide[data-scene="multiply"][data-step="2"] .countB,#slide[data-scene="multiply"][data-step="3"] .countB,#slide[data-scene="multiply"][data-step="4"] .countB{fill:#994c72;stroke:#f07aa5;stroke-width:2.5}#slide[data-scene="multiply"][data-step="2"] .countAB,#slide[data-scene="multiply"][data-step="3"] .countAB,#slide[data-scene="multiply"][data-step="4"] .countAB{fill:#9a7a33;stroke:#f4c95d;stroke-width:3}.count-grid .bLabel,.count-grid .abLabel{opacity:0;transition:opacity .55s ease}#slide[data-scene="multiply"][data-step="1"] .bLabel,#slide[data-scene="multiply"][data-step="2"] .bLabel,#slide[data-scene="multiply"][data-step="3"] .bLabel,#slide[data-scene="multiply"][data-step="4"] .bLabel{opacity:1}#slide[data-scene="multiply"][data-step="2"] .abLabel,#slide[data-scene="multiply"][data-step="3"] .abLabel,#slide[data-scene="multiply"][data-step="4"] .abLabel{opacity:1}
#slide[data-scene="multiply"][data-step="4"] .count-numeric{opacity:0;transform:translateY(-10px)}#slide[data-scene="multiply"][data-step="4"] .count-general{transition-delay:.7s}
.no-motion *, .no-motion *::before,.no-motion *::after{transition:none!important;animation:none!important}
:fullscreen #controls{display:none}:fullscreen #viewport{height:100vh}

<body>
<div id="viewport" title="Click for next teaching beat"><main id="slide" role="img" aria-label="Chapter 4 animated lecture"></main></div>
<nav id="controls"><button id="back">← Back</button><button id="next">Next →</button><button id="replay">Replay</button><span id="counter"></span><button id="jump">Go to</button><button id="noteButton">Notes</button><button id="full">Fullscreen</button><span id="chapterName"></span></nav>
<aside id="notes" hidden></aside>
<dialog id="jumpDialog"><form method="dialog"><label>Hold <input id="jumpInput" type="number" min="1" required style="width:90px"></label> <button value="go">Go</button> <button value="cancel" formnovalidate>Cancel</button></form></dialog>
<script>
'use strict';
const BLUE='#5ab0f2',MAGENTA='#f07aa5',TEAL='#5fd4c5',GOLD='#f4c95d',ICE='#b3ddff';
const PART_COLORS=[MAGENTA,GOLD,'#c3a5f5',TEAL,'#ff9d7c'];
const pos=(x,y,w,h,content,cls='',from=0)=>`<div class="at ${cls}${from?' reveal':''}" ${from?`data-from="${from}"`:''} style="left:${x}px;top:${y}px;width:${w}px;${h?`height:${h}px;`:''}">${content}</div>`;
const head=(topic,title,sub='')=>`<div class="eyebrow">${topic}</div><div class="title">${title}</div><div class="rule"></div>${sub?`<div class="sub">${sub}</div>`:''}`;
const f=(num,den)=>`<span class="fraction"><span class="num">${num}</span><span class="den">${den}</span></span>`;
function medicalGrid(){return `<div class="grid-frame"><div class="base"></div><div class="disease"></div><div class="tp"></div><div class="fp"></div><div class="gridlines"></div></div>`}
function venn(){return `<div class="venn-wrap"><svg viewBox="0 0 710 480" aria-label="Sample space S with overlapping events A and B"><defs><clipPath id="vclipB"><circle cx="420" cy="234" r="161"/></clipPath><pattern id="hatch" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="${GOLD}" stroke-width="3" opacity=".8"/></pattern></defs><rect class="venn-oldS" x="30" y="21" width="650" height="422" rx="8" fill="#172b3b" stroke="#9cb1c2" stroke-width="3"/><text x="52" y="65" class="svgmath">S</text><circle class="venn-Aout" cx="290" cy="234" r="161" fill="${BLUE}" fill-opacity=".25" stroke="${BLUE}" stroke-width="5"/><circle cx="420" cy="234" r="161" fill="${MAGENTA}" fill-opacity=".17" stroke="${MAGENTA}" stroke-width="5"/><circle class="venn-focus" cx="420" cy="234" r="161" fill="none" stroke="${MAGENTA}" stroke-width="9"/><circle class="venn-lens" cx="290" cy="234" r="161" fill="url(#hatch)" clip-path="url(#vclipB)"/><text x="158" y="230" class="svgmath" style="fill:${BLUE}">A</text><text x="546" y="230" class="svgmath" style="fill:${MAGENTA}">B</text><text class="venn-lens" x="347" y="244" style="font:35px Georgia;fill:${GOLD}">A∩B</text></svg></div>`}
function twoPartition(leftLabel='B',rightLabel='Bᶜ'){
  const bx=260,by=214,br=143;
  return `<svg viewBox="0 0 770 440" style="width:770px;height:440px" aria-label="B is a circle; B complement is everything in S outside it"><defs><clipPath id="clipA2"><ellipse cx="421" cy="236" rx="287" ry="121"/></clipPath><mask id="outsideB2"><rect x="20" y="18" width="730" height="385" fill="white"/><circle cx="${bx}" cy="${by}" r="${br}" fill="black"/></mask><pattern id="p2hGold" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="15" stroke="${GOLD}" stroke-width="3"/></pattern><pattern id="p2hIce" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="15" stroke="${ICE}" stroke-width="3"/></pattern></defs><rect x="20" y="18" width="730" height="385" fill="#25384a" stroke="#9cb1c2" stroke-width="3"/><circle cx="${bx}" cy="${by}" r="${br}" fill="${MAGENTA}" fill-opacity=".17"/><ellipse cx="421" cy="236" rx="287" ry="121" fill="${BLUE}" fill-opacity=".22" stroke="${BLUE}" stroke-width="5"/><circle cx="${bx}" cy="${by}" r="${br}" fill="none" stroke="${MAGENTA}" stroke-width="5"/><g clip-path="url(#clipA2)"><circle class="partition-piece piece-left" cx="${bx}" cy="${by}" r="${br}" fill="url(#p2hGold)"/><rect class="partition-piece piece-right" x="20" y="18" width="730" height="385" fill="url(#p2hIce)" mask="url(#outsideB2)"/></g><text x="40" y="54" class="svgmath">S</text><text x="226" y="130" text-anchor="middle" class="svgmath" style="fill:${MAGENTA}">${leftLabel}</text><text x="597" y="80" text-anchor="middle" class="svgmath" style="fill:${ICE}">${rightLabel}</text><text x="565" y="238" class="svgmath" style="fill:${BLUE}">A</text></svg>`;
}
function fivePartition(){
  const edges=[22,126,294,419,613,742];
  // Each neighboring pair uses the same curved seam in reverse, so the five
  // jigsaw pieces fill S without gaps or overlap.
  const down=(x,s)=>`L ${x} 115 C ${x+s*4} 115 ${x+s*8} 117 ${x+s*10} 121 C ${x+s*36} 121 ${x+s*36} 170 ${x+s*10} 170 C ${x+s*8} 174 ${x+s*4} 176 ${x} 176 L ${x} 258 C ${x-s*4} 258 ${x-s*8} 260 ${x-s*10} 264 C ${x-s*36} 264 ${x-s*36} 313 ${x-s*10} 313 C ${x-s*8} 317 ${x-s*4} 319 ${x} 319 L ${x} 403`;
  const up=(x,s)=>`L ${x} 319 C ${x-s*4} 319 ${x-s*8} 317 ${x-s*10} 313 C ${x-s*36} 313 ${x-s*36} 264 ${x-s*10} 264 C ${x-s*8} 260 ${x-s*4} 258 ${x} 258 L ${x} 176 C ${x+s*4} 176 ${x+s*8} 174 ${x+s*10} 170 C ${x+s*36} 170 ${x+s*36} 121 ${x+s*10} 121 C ${x+s*8} 117 ${x+s*4} 115 ${x} 115 L ${x} 18`;
  let puzzle='',highlights='',labels='',patterns='';
  for(let i=0;i<5;i++){
    const left=edges[i],right=edges[i+1],rightSign=(i+1)%2?1:-1,leftSign=i%2?1:-1;
    const path=`M ${left} 18 L ${right} 18 ${i===4?`L ${right} 403`:down(right,rightSign)} L ${left} 403 ${i===0?`L ${left} 18`:up(left,leftSign)} Z`;
    puzzle+=`<path d="${path}" fill="${PART_COLORS[i]}" fill-opacity=".2" stroke="#a8bdca" stroke-width="2.2"/>`;
    highlights+=`<path class="piece5" d="${path}" fill="url(#p5h${i})" style="transition-delay:${i*.32}s"/>`;
    labels+=`<text x="${(left+right)/2}" y="70" text-anchor="middle" style="font:36px Georgia;fill:${PART_COLORS[i]}">B<tspan baseline-shift="sub" font-size="21">${i+1}</tspan></text>`;
    patterns+=`<pattern id="p5h${i}" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="15" stroke="${PART_COLORS[i]}" stroke-width="3"/></pattern>`;
  }
  return `<svg viewBox="0 0 764 430" style="width:764px;height:430px" aria-label="Five interlocking pieces B1 to B5 partition S"><defs><clipPath id="clipA5"><ellipse cx="385" cy="238" rx="300" ry="105"/></clipPath>${patterns}</defs><rect x="22" y="18" width="720" height="385" fill="#162b3a"/>${puzzle}<ellipse cx="385" cy="238" rx="300" ry="105" fill="${BLUE}" fill-opacity=".2" stroke="${BLUE}" stroke-width="5"/><g clip-path="url(#clipA5)">${highlights}</g><rect x="22" y="18" width="720" height="385" fill="none" stroke="#9cb1c2" stroke-width="3"/>${labels}<text x="36" y="390" class="svgmath">S</text><text x="370" y="250" class="svgmath" style="fill:${BLUE}">A</text></svg>`;
}
function chainSvg(){return `<svg viewBox="0 0 475 445" style="width:475px;height:445px"><defs><clipPath id="cC"><circle cx="247" cy="177" r="121"/></clipPath><clipPath id="cB"><circle cx="293" cy="260" r="121"/></clipPath><pattern id="cH" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="${GOLD}" stroke-width="3"/></pattern></defs><rect x="25" y="18" width="420" height="410" rx="6" fill="#182d3d" stroke="#9cb1c2" stroke-width="3"/><text x="43" y="56" class="svgmath">S</text><circle cx="183" cy="258" r="121" fill="${BLUE}" fill-opacity=".12" stroke="${BLUE}" stroke-width="5"/><circle cx="293" cy="260" r="121" fill="${MAGENTA}" fill-opacity=".12" stroke="${MAGENTA}" stroke-width="5"/><circle cx="247" cy="177" r="121" fill="${TEAL}" fill-opacity=".12" stroke="${TEAL}" stroke-width="5"/><circle class="chain-C" cx="247" cy="177" r="121" fill="${TEAL}" fill-opacity=".22"/><g class="chain-BC" clip-path="url(#cC)"><circle cx="293" cy="260" r="121" fill="${MAGENTA}" fill-opacity=".45"/></g><g class="chain-ABC" clip-path="url(#cC)"><circle cx="183" cy="258" r="121" fill="url(#cH)" clip-path="url(#cB)"/></g><text x="88" y="301" class="svgmath" style="fill:${BLUE}">A</text><text x="357" y="302" class="svgmath" style="fill:${MAGENTA}">B</text><text x="233" y="98" class="svgmath" style="fill:${TEAL}">C</text><text class="chain-ABC" x="209" y="229" style="font:27px Georgia;fill:${GOLD}">A∩B∩C</text></svg>`}
function countGrid(){let cells='';for(let i=0;i<20;i++){const x=47+(i%5)*80,y=70+Math.floor(i/5)*61;cells+=`<rect class="cell ${i<8?'countB':''} ${i<3?'countAB':''}" x="${x}" y="${y}" width="64" height="47" rx="4" style="transition-delay:${(i%8)*.08}s"/>`}return `<svg class="count-grid" viewBox="0 0 500 370" style="width:500px;height:370px"><rect x="19" y="24" width="443" height="317" rx="6" fill="#152b3b" stroke="#9aafbd" stroke-width="3"/><text x="36" y="57" class="svgmath">S: 20 outcomes</text>${cells}<text x="51" y="337" class="svgsmall bLabel" style="fill:${MAGENTA}">8 in B</text><text x="250" y="337" class="svgsmall abLabel" style="fill:${GOLD}">3 in A∩B</text></svg>`}
const scenes={
framework(){return head('Chapter 4','Two views of uncertainty','The same positive test can be understood in two ways.')+pos(100,305,645,0,'Frequentist','body strong')+pos(857,305,650,0,'Bayesian','body strong')+pos(100,373,620,0,'Imagine repeating this test in comparable cases.','body')+pos(857,373,625,0,'Start with uncertainty about disease.','body')+pos(100,487,625,0,'Track how often the procedure is right.','small',1)+pos(858,487,625,0,'Update that belief after a test result.','small',2)+pos(100,612,590,100,`<div style="display:flex;gap:18px">${Array.from({length:12},(_,i)=>`<span style="font-size:44px;color:${i<2?BLUE:'#7693a5'}">●</span>`).join('')}</div><div class="tiny muted" style="margin-top:14px">Hypothetical repetitions of the same process</div>`,'',1)+pos(857,609,555,0,`<div style="height:5px;width:460px;background:#3f596d;position:relative;margin-top:25px"><span id="beliefMarker" style="position:absolute;left:7px;top:-18px;font-size:37px;color:${GOLD};transition:transform 1s cubic-bezier(.2,.7,.1,1)">◆</span></div><div class="tiny muted" style="margin-top:34px">Prior: a starting belief before the result</div>`,'',2)+pos(100,787,1400,0,'Both approaches can analyze a patient and both use conditional probability.','small gold',3)+pos(796,308,2,390,'','vline');},
puzzle(){return head('The question','A positive test for a rare disease','Fictional illustration: every small square is one of 10,000 hypothetical people.')+medicalGrid()+pos(890,291,620,0,'100 have the disease (1%)','body blue',1)+pos(890,385,620,0,'90 of those 100 test positive','small gold',2)+pos(890,470,620,0,'False-positive rate: 5%','small magenta',3)+pos(889,602,620,0,'If a test is positive, what is the chance of disease?','question gold',4)+pos(890,799,615,0,'All numbers are invented for teaching.','tiny muted');},

  const total='<span class="blue">P(A)</span> = <span class="gold">P(A|B)P(B)</span> + <span class="ice">P(A|Bᶜ)P(Bᶜ)</span>';

const beats=[
['framework',0,'Two interpretations','Ask what a probability represents. Frequentist reasoning studies long-run behavior under repeated comparable conditions. Bayesian reasoning explicitly represents uncertainty about a proposition or parameter. Do not say only Bayesians can reason about an individual.'],
['framework',1,'Repeated samples','Point to the repeated-outcome icons. The same question can be studied through the behavior of a procedure over many comparable cases.'],
['framework',2,'A starting belief','A prior is a starting belief before new evidence. We are using this word informally, without specifying a prior distribution. The positive test changes the belief; it does not physically change the patient.'],
['framework',3,'Shared conditioning','Both frameworks use conditional probability. This lesson develops the probability rules shared by both, not a philosophical contest.'],
['puzzle',0,'Fictional cohort','This is a deliberately invented medical-testing scenario, not data from a clinical test. The grid contains 10,000 individuals, one per square. Ask what the probability of disease is after a positive result, but do not compute yet.'],
['puzzle',1,'Rare disease','The first column has 100 disease cases, or 1% of 10,000. The other 9,900 do not have the disease.'],
['puzzle',2,'Sensitivity','Of the 100 disease cases, 90 test positive. The first 90 cells in the disease column are highlighted gold. Sensitivity here is P(T|D)=90%.'],
['puzzle',3,'False positives','The 5% false-positive rate applies to the 9,900 without disease. The five top rows of the other 99 columns illustrate the false positives, but do not reveal the count of 495 yet. Ask which denominator a positive result calls for.'],
['puzzle',4,'Prediction hold','Pause. Ask for an intuition, not a number. Is the chance 90%, much lower, or higher? What must we count in the denominator?'],
['conditional',0,'The full sample space','A and B overlap within the same original sample space S. Diagram area is illustrative, not automatically a probability measure.'],
['conditional',1,'Focus B','Knowing B occurred restricts our reference class to B. S itself has not physically changed.'],
['conditional',2,'Find the overlap','Within B, the outcomes also in A comprise A∩B. The gold hatch and label mark the target.'],
['conditional',3,'Read the notation','Read P(A|B) as the probability of A given that B occurred. Emphasize that P(A|B) and P(B|A) answer different questions.'],
['conditional',4,'Formal definition','P(A|B)=P(A∩B)/P(B), provided P(B)>0. In a general probability model, compare probability mass, not arbitrary drawn areas.'],
['multiply',0,'Start from conditional definition','Recap the definition before rearranging.'],
['multiply',1,'Multiplication rule','Multiply both sides by P(B). The joint probability is the probability of entering B times the conditional probability of A within B. No independence assumption.'],
['multiply',2,'Count bridge','Now temporarily assume a finite equally likely sample space so each probability can be written as a count ratio.'],
['multiply',3,'Apply counts','In the visual: 20 equally likely cells in S, eight magenta-or-gold cells in B, and three gold cells in A∩B. Thus 3/20=(8/20)(3/8). Keep the numerator/denominator reference group visible.'],
['multiply',4,'Generalize the counts','Replace 20, 8, and 3 with |S|, |B|, and |A∩B|. The middle |B| cancels. The count bridge is exact for finite equally likely outcomes; the general multiplication rule follows from the conditional definition even when outcomes are unequally likely. No independence or limit is needed.'],
['chain',0,'Three nested filters','This nested-set illustration makes the successive conditioning easy to see, but the equation works for arbitrary overlapping events, not just nested ones.'],
['chain',1,'Start with C','First enter C.'],
['chain',2,'Then B within C','Multiply by P(B|C) to enter B∩C.'],
['chain',3,'Then A within B and C','Multiply by P(A|B∩C) to reach A∩B∩C.'],
['chain',4,'Three-event rule','P(A∩B∩C)=P(C)P(B|C)P(A|B∩C). Assume P(C)>0 and P(B∩C)>0 for these conditional factors.'],
['chain',5,'Order caveat','Intersection is associative and commutative; it is not reflexive. You may choose another entry order, but then all conditional factors must change accordingly.'],
['partition2',0,'Two exhaustive cases','The universe has two regions, B and its complement. Event A crosses the boundary.'],
['partition2',1,'Disjoint pieces','The symbol ⊔ emphasizes a disjoint union. Show the left and right pieces of A separately.'],
['partition2',2,'Why add','The probability axiom adds probabilities of disjoint events.'],
['partition2',3,'Add intersections','P(A)=P(A∩B)+P(A∩Bᶜ).'],
['partition2',4,'Two-case LTP','Apply the multiplication rule separately in B and Bᶜ. The conditional terms require positive probabilities; if one case has zero probability, use the intersection form instead.'],
['partition5',0,'Five exhaustive cases','The five jigsaw pieces are mutually disjoint and exhaust the sample space. Their colors will match the five summands. The blue A crosses them.'],
['partition5',1,'Five pieces','Reveal the portions of A inside the five regions.'],
['partition5',2,'Add pieces','P(A) equals the sum of the five intersection probabilities.'],
['partition5',3,'Generalized LTP','Turn each intersection into P(A|Bᵢ)P(Bᵢ) for positive-probability Bᵢ.'],
['partition5',4,'Relate two cases','Do not imply B₃ through B₅ vanish. We now choose a new n=2 partition with B₁=B and B₂=Bᶜ. The formula is the same rule.'],
['payoff',0,'Return to prediction','Recall the earlier question. The cohort and test assumptions have not changed.'],
['payoff',1,'Partition on disease','Use D and Dᶜ as the two cases. T is the target event: a positive test.'],
['payoff',2,'True positives','Among 100 disease cases, 90 are positive. P(D∩T)=90/10,000.'],
['payoff',3,'False positives','Among 9,900 without disease, 5% or 495 test positive. P(Dᶜ∩T)=495/10,000.'],
['payoff',4,'Total positive mass','Law of total probability: P(T)=P(T|D)P(D)+P(T|Dᶜ)P(Dᶜ).'],
['payoff',5,'Denominator','There are 585 positive results, of which 90 come from disease cases.'],
['payoff',6,'Medical payoff','P(D|T)=90/585=2/13≈15.4%. The test is 90% sensitive, but P(D|T) is not 90%. The base rate matters. This fictional result is not medical guidance. Next class can begin with the secretary problem.']
];
let index=0,activeScene=null,notesOpen=false;
const $=id=>document.getElementById(id),slide=$('slide');
function resize(){const availableHeight=window.innerHeight-($('controls').offsetHeight||0);slide.style.transform=`scale(${Math.min(window.innerWidth/1600,availableHeight/900)})`}
function applyStep(step,instant=false){slide.dataset.step=String(step);slide.querySelectorAll('[data-from]').forEach(el=>el.classList.toggle('on',step>=Number(el.dataset.from)));if(activeScene==='puzzle'||activeScene==='payoff'){slide.querySelector('.disease').style.opacity=step>=1?'1':'0';slide.querySelector('.tp').style.opacity=step>=2?'1':'0';slide.querySelector('.fp').style.opacity=step>=3?'1':'0'}if(activeScene==='framework'){const marker=slide.querySelector('#beliefMarker');if(marker)marker.style.transform=step>=2?'translateX(245px)':'translateX(0)'}if(activeScene==='partition2'){slide.querySelector('.piece-left').style.opacity=step>=1?'1':'0';slide.querySelector('.piece-right').style.opacity=step>=2?'1':'0'}if(activeScene==='partition5'){slide.querySelector('.title').textContent=step===4?'The same rule with two cases':'A partition into five cases';slide.querySelector('.sub').innerHTML=step===4?'For n = 2, let <span class="magenta">B₁ = B</span> and <span class="ice">B₂ = Bᶜ</span>.':'Every outcome belongs to exactly one Bᵢ.'}if(instant){slide.classList.add('no-motion');requestAnimationFrame(()=>requestAnimationFrame(()=>slide.classList.remove('no-motion')))}}
function show(n,instant=false){if(n<0||n>=beats.length)return;index=n;const [scene,step,title,note]=beats[n];if(scene!==activeScene){activeScene=scene;slide.innerHTML=scenes[scene]();slide.dataset.scene=scene;instant=true}applyStep(step,instant);$('counter').textContent=`${n+1} / ${beats.length}`;$('back').disabled=n===0;$('next').disabled=n===beats.length-1;$('chapterName').textContent=title;$('notes').innerHTML=`<h2>${n+1}. ${title}</h2><p>${note}</p>`;history.replaceState(null,'',`#${n+1}`);document.title=`${n+1}/${beats.length} · ${title}`}
function next(){show(index+1)}function back(){show(index-1,true)}function replay(){const [scene,step]=beats[index];if(step===0){slide.classList.remove('no-motion');slide.classList.add('pop');setTimeout(()=>slide.classList.remove('pop'),750);return}const previous=step-1;applyStep(previous,true);requestAnimationFrame(()=>requestAnimationFrame(()=>applyStep(step,false)))}
$('next').onclick=next;$('back').onclick=back;$('replay').onclick=replay;$('viewport').onclick=next;$('noteButton').onclick=()=>{notesOpen=!notesOpen;$('notes').hidden=!notesOpen};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('jump').onclick=()=>{$('jumpInput').value=index+1;$('jumpInput').max=beats.length;$('jumpDialog').showModal();$('jumpInput').select()};$('jumpDialog').onclose=()=>{if($('jumpDialog').returnValue==='go')show(Number($('jumpInput').value)-1,true)};
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/INPUT|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='r')replay();else if(e.key.toLowerCase()==='n')$('noteButton').click();else if(e.key.toLowerCase()==='f')$('full').click();else if(e.key.toLowerCase()==='g')$('jump').click()});window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();const initial=Number(location.hash.slice(1));show(Number.isInteger(initial)&&initial>=1&&initial<=beats.length?initial-1:0,true);window.lecture={beats,show,next,back,replay,get index(){return index}};
</script>
