 }
 else if(s.mode==='independence')body=`<h2>Where independence enters</h2><div class="ref-rule">${w('P(X=x, Y=y)')}<br>= ${w('P(X=x) P(Y=y)')}</div><p>Only this step separates the joint weight into two weights.</p><p>Then the inner Y-average is the same for every x.</p><div class="ref-rule">${d('E[A] = 0')} &nbsp; ${d('E[B] = 0')}</div><p class="ref-small">A = X − μₓ and B = Y − μᵧ. The example’s positive and negative weighted products cancel.</p>`;

}

]);

const varianceExpanded=`Var(X) = E[${v('X²')} − ${m('2μ')}X + ${m('μ²')}]`;
const varianceLinear=`Var(X) = E[${v('X²')}] − E[${m('2μ')}X] + E[${m('μ²')}]`;
const varianceConstants=`Var(X) = E[${v('X²')}] − ${m('2μ')}E[X] + ${m('μ²')}`;
scene('shortcut','Keep the definition; expand one piece at a time',[
 ...proof('Expand the square · keep expectation around it',ref('shortcut'),[
 R(`Var(X) = E[${d('(X − μ)²')}]`,'Start with the mean squared deviation; μ = E[X].'),
 R(`Var(X) = E[${d('(X − μ)(X − μ)')}]`,'A square means multiply the expression by itself.'),
 R(`Var(X) = E[${v('X²')} − ${d('μX')} − ${d('μX')} + ${m('μ²')}]`,'Multiply all four pairs; two negative products appear.'),
 R(varianceExpanded,'Combine the two identical middle terms: −μX − μX = −2μX.')
 ],'This is still the original variance definition, written differently.'),
 ...proof('Take expectations · one term at a time',ref('shortcut'),[
 R(varianceExpanded,'Carry forward the expanded square.'),
 R(varianceLinear,'Linearity splits the expectation of a sum or difference.'),
 R(`Var(X) = E[${v('X²')}] − ${m('2μ')}E[X] + E[${m('μ²')}]`,'2μ is fixed; pull it outside its expectation.'),
 R(varianceConstants,'The expectation of the fixed number μ² is μ².')
 ],'μ is one fixed mean, not a new random outcome.',true),
 ...proof('Substitute the mean · expose the cancellation',ref('shortcut'),[
 R(varianceConstants,'Keep the result of linearity visible.'),
 R(`Var(X) = E[${v('X²')}] − ${m('2μ')} × ${m('μ')} + ${m('μ²')}`,'Replace E[X] by its name μ.'),
 R(`Var(X) = E[${v('X²')}] − ${m('2μ²')} + ${m('μ²')}`,'Multiply μ by μ to obtain μ².'),
 R(`Var(X) = E[${v('X²')}] − ${m('μ²')}`,'Combine −2μ² + μ²: one negative μ² remains.'),
 R(`Var(X) = E[${v('X²')}] − ${m('(E[X])²')}`,'Write μ as E[X] to name the two different operations.')
 ],'Average of squares minus square of average equals variance.',true),
 ...proof('Fair-die check · connect back to the earlier example',ref('shortcut'),[
 R(`Var(X) = E[${v('X²')}] − ${m('(E[X])²')}`,'Keep the derived rule visible.'),
 R(`Var(X) = ${v(frac(91,6))} − ${m(frac(49,4))}`,'Use E[X²] = 91/6 and (E[X])² = (3.5)² = 49/4.'),
 R(`Var(X) = ${v(frac(182,12))} − ${m(frac(147,12))}`,'Use the common denominator 12.'),
 R(`Var(X) = ${frac(35,12)}`,'Subtract numerators: 182 − 147 = 35. This matches the direct calculation.')
 ],'The earlier gap between E[X²] and (E[X])² is exactly the variance.',true,'Assume finite second moment. Variance is nonnegative; the gap is zero exactly when X is almost surely constant.')
]);

const sumVar='Var(X + Y)',crossResult=`${sumVar} = Var(X) + ${d('2E[AB]')} + Var(Y)`;
const crossJoint=`E[AB] = ${sx}${sy} ${d('(x − μₓ)(y − μᵧ)')} ${pj}`;
const crossFactoredWeight=`E[AB] = ${sx}${sy} ${d('(x − μₓ)(y − μᵧ)')} ${px}${py}`;
const crossGrouped='E[AB] = '+splitMath(`${sx} ${d('(x − μₓ)')}${px}`,`× [${sy} ${d('(y − μᵧ)')}${py}]`);
const crossSeparate='E[AB] = '+splitMath(`[${sx} ${d('(x − μₓ)')}${px}]`,`× [${sy} ${d('(y − μᵧ)')}${py}]`);
scene('sums','Add spreads only after following the cross term',[
 ...proof('Center the total · start with its actual mean',ref('centered','values'),[
 R('(X + Y) − E[X + Y]','The total’s deviation is its value minus its mean.'),
 R('= (X + Y) − (μₓ + μᵧ)','Use linearity: E[X + Y] = μₓ + μᵧ.'),
 R('= X + Y − μₓ − μᵧ','Distribute the minus sign to both mean terms.'),
 R(`= ${d('(X − μₓ)')} + ${d('(Y − μᵧ)')}`,'Regroup each value with its own mean.'),
 R(`= ${d('A + B')}`,'Name the centered variables A = X − μₓ and B = Y − μᵧ.')
 ],'The deviation of a total is the total of the deviations.'),
 ...proof('Square the total deviation · track every product',count=>ref('centered',count>=3?'product':'deviations'),[
 R(`${sumVar} = E[${d('(A + B)²')}]`,'Insert the total deviation into the variance definition.'),
 R(`${sumVar} = E[(A + B)(A + B)]`,'Write the square as two identical factors.'),
 R(`${sumVar} = E[A² + ${d('AB')} + ${d('BA')} + B²]`,'Multiply all four pairs; both mixed products matter.'),
 R(`${sumVar} = E[A² + ${d('2AB')} + B²]`,'AB = BA, so the two mixed products combine.')
 ],'The extra product measures how the two deviations move together.'),
 ...proof('Average the expanded square',ref('centered'),[
 R(`${sumVar} = E[A² + ${d('2AB')} + B²]`,'Carry forward the expanded square.'),
 R(`${sumVar} = E[A²] + E[${d('2AB')}] + E[B²]`,'Split the expectation into three expectations.'),
 R(`${sumVar} = E[A²] + ${d('2E[AB]')} + E[B²]`,'Pull the fixed factor 2 outside the middle expectation.'),
 R(crossResult,'E[A²] is Var(X); E[B²] is Var(Y).')
 ],'Variances add only when the average cross product is zero.',true),
 ...proof('Why a centered variable has mean zero',ref('centered','deviations'),[
 R(`E[A] = E[${d('X − μₓ')}]`,'Recall A = X − μₓ.'),
 R('E[A] = E[X] − E[μₓ]','Apply linearity to the difference.'),
 R('E[A] = E[X] − μₓ','μₓ is a fixed number, so its expectation is itself.'),
 R('E[A] = μₓ − μₓ = 0','Use E[X] = μₓ. The identical argument gives E[B] = 0.')
 ],'Zero individual means alone do not guarantee E[AB] = 0.'),
 ...proof('Independence · change only the probability weight',ref('independence'),[
 R(crossJoint,'Write the average product using the joint probability.',undefined,true),
 R(crossFactoredWeight,'Independence: replace the joint weight by P(X=x)P(Y=y).',undefined,true),
 R(crossGrouped,'Hold x fixed. Pull its deviation and probability outside the y-sum.',undefined,true)
 ],'This factorization is the precise step that requires independence.'),
 ...proof('Independence · separate the two weighted averages',ref('independence'),[
 R(crossGrouped,'Carry forward the inner Y-average.',undefined,true),
 R(crossSeparate,'The bracket has no x; take it outside the x-sum.',undefined,true),
 R(`E[AB] = ${d('E[A]')} ${d('E[B]')}`,'Each bracket is the mean of a centered variable.'),
 R('E[AB] = 0 × 0 = 0','Use the two centered means we just calculated.')
 ],'The product average vanishes here because the variables are independent.',true),
 ...proof('Return to the variance formula · remove the cross term',ref('centered','cancel'),[
 R(crossResult,'Bring back the general result before using independence.'),
 R(`${sumVar} = Var(X) + ${d('2 × 0')} + Var(Y)`,'Substitute E[AB] = 0 for independent variables.'),
 R(`${sumVar} = Var(X) + Var(Y)`,'Remove the zero term.'),
 R(`${sumVar} = ¼ + ¼ = ½`,'Check the two independent fair coins.')
 ],'Independence is sufficient, not necessary; a zero cross term is enough.',false,'Finite second moments. The cross term is twice the covariance. It may be positive, negative, or zero for dependent variables.'),
 ...proof('Difference · carefully distribute the minus sign',ref('centered','values'),[
 R('(X − Y) − E[X − Y]','Start from the value minus its expected value.'),
 R('= (X − Y) − (μₓ − μᵧ)','Linearity gives the difference of the two means.'),
 R('= X − Y − μₓ + μᵧ','Subtracting the mean difference makes the final sign positive.'),
 R('= (X − μₓ) − (Y − μᵧ)','Group each value with its own mean.'),
 R('= A − B','Use the same centered variables as in the sum.')
 ],'A minus sign applies to every term inside its parentheses.'),
 ...proof('Difference · square the centered difference',ref('centered'),[
 R('(X − Y) − (μₓ − μᵧ) = A − B','Keep the completed deviation calculation visible.'),
 R('Var(X − Y) = E[(A − B)(A − B)]','Insert the difference into the variance definition.'),
 R(`Var(X − Y) = E[A² ${d('− AB − BA')} + B²]`,'Multiply all four pairs; the final product is positive.'),
 R(`Var(X − Y) = E[A² ${d('− 2AB')} + B²]`,'Combine the two negative mixed products.')
 ],'The cross term changes sign; the squared B term stays positive.'),
 ...proof('Difference · average, then apply independence',ref('centered'),[
 R(`Var(X − Y) = E[A² ${d('− 2AB')} + B²]`,'Carry forward the expanded square.'),
 R(`Var(X − Y) = E[A²] − E[${d('2AB')}] + E[B²]`,'Separate the three expectations.'),
 R(`Var(X − Y) = E[A²] ${d('− 2E[AB]')} + E[B²]`,'Pull the fixed 2 outside the expectation.'),
 R(`Var(X − Y) = Var(X) ${d('− 2E[AB]')} + Var(Y)`,'Identify each mean squared deviation as a variance.'),
 R('Var(X − Y) = Var(X) + Var(Y)','Under independence E[AB] = 0, so the middle term vanishes.')
 ],'Independent differences add variances: subtraction does not make spread negative.',true)
]);
const questions=[
['Can the mean be a value the variable never takes?',coinMass(),eq('Our coin takes only 0 and 1.'),eq(`Yes: its mean is ${m('½')}.`),'The mean is a balance point, not a promised outcome.'],
['What happens for Y = −2X + 5?',mass(dieX.map(x=>-2*x+5),fair,{rv:'Y',min:-8,max:6,labels:pFair}),eq('Predict the mean and variance.'),eq('E[Y] = −2E[X] + 5<br>Var(Y) = 4 Var(X)',true),'The negative sign reflects the values; squaring the scale removes the sign.'],
['Do means add when variables depend on one another?',{kind:'joint',total:true},eq('Does E[X + Y] require independence?'),eq('E[X + Y] = E[X] + E[Y]',true),'No independence is required when both expectations are finite.'],
['What is Var(X + X)?',mass([0,2],[.5,.5],{rv:'2X',min:-1,max:3,labels:['1/2','1/2']}),eq('Use X + X = 2X.'),eq('Var(X + X) = 4 Var(X)'), 'The repeated X is dependent on itself; the independent-sum rule does not apply.']];
scene('check','One last prediction at a time',questions.flatMap((q,i)=>[H(`Question ${i+1}: ${q[0]}`,i===1?{...q[1],showMean:false}:q[1],[q[2]],'Pause for a prediction before advancing.'),H(`Answer ${i+1}: ${q[0]}`,q[1],[q[3]],q[4],i===3?'For nonconstant X, 4Var(X) differs from 2Var(X). End here; named Bernoulli and binomial distributions begin Monday.':q[4])]));

let sceneIndex=0,step=0,frame=0,lastState=null,lastParts=[],lastScene='';let staticMode=matchMedia('(prefers-reduced-motion: reduce)').matches;const counts=scenes.map(s=>s.steps),total=counts.reduce((a,b)=>a+b,0);

function variableContext(id,step){
 const coin='X = number of heads in one fair coin flip (0 for tails, 1 for heads).';
 const die='X = number showing on one roll of a die (1, 2, 3, 4, 5 or 6).';
 if(id==='coin')return step<2?'Experiment: flip one fair coin; the outcomes are tails and heads.':coin;
 if(id==='coinmean')return coin;
 if(id==='experiments')return 'Xᵢ = number of heads on flip i; xᵢ is its observed value (0 or 1).';
 if(id==='balance')return 'X = the numerical outcome of this experiment; possible values are 1, 3 and 5.';
 if(id==='dice'||id==='expectation')return die;
 if(id==='transform')return step!==4?'X = face value of a fair die; define Y = X², its square.':'X = face value of a fair die; define Y = g(X), a chosen function of X.';
 if(id==='chapter1'||id==='datavariance')return 'Observed data: x₁, …, x₅ = 1, 1, 2, 3, 3. These are recorded values; n = 5.';
 if(id==='spread')return step===0?'X takes the values 2 and 4, with P(X = 2) = P(X = 4) = ½.':'Now X takes 1 and 5, with P(X = 1) = P(X = 5) = ½.';
 if(['deviations','variance','shortcut'].includes(id))return 'X = face value of a fair die; P(X = x) = 1/6 for x = 1, 2, 3, 4, 5, 6.';
 if(id==='shift')return step===0?die:step<3?'X = face value of a fair die; define Y = X + 2.':'X = face value of a fair die; define Y = 2X + 2.';
 if(id==='affineproof')return 'X = face value of a fair die; Y = aX + b, with fixed a and b. Picture: a = b = 2.';
 if(id==='linearity')return 'X = heads on the first fair flip; Y = heads on the second. Picture: independent flips; linearity also allows dependence.';
 if(id==='sums')return 'X, Y = heads on first/second flip; μₓ = E[X], μᵧ = E[Y]. A = X − μₓ; B = Y − μᵧ. Picture: independent flips.';
 if(id==='check'){const q=Math.floor(step/2);return q===0||q===3?coin:q===1?'X = face value of a fair die; define Y = −2X + 5.':'X = heads on the first flip; Y = heads on the second. The rule also allows dependence.';}
 return '';
}

function resize(){$('slide').style.transform=`scale(${Math.min(innerWidth/1600,(innerHeight-64)/900)})`}
function render(animate=true){cancelAnimationFrame(frame);const s=scenes[sceneIndex],h=s.holds[step],from=lastState,to=h.diagram;$('slide').dataset.proof=String(!!h.proof);$('title').textContent=s.title;$('caption').textContent=h.caption;$('rvContext').textContent=variableContext(s.id,step);$('words').innerHTML=h.parts.map((html,i)=>`<div class="piece${animate&&!staticMode&&!h.proof&&lastParts[i]!==html?' new':''}">${html}</div>`).join('');$('takeaway').textContent=h.take;$('notes').innerHTML=`<h2>${s.title} · step ${step+1}</h2><p>${h.notes}</p>`;$('counter').textContent=`${counts.slice(0,sceneIndex).reduce((a,b)=>a+b,0)+step+1} / ${total}`;$('topicProgress').textContent=`${sceneIndex+1} / ${scenes.length} topics · ${step+1} / ${s.steps} steps`;$('back').disabled=sceneIndex===0&&step===0;$('next').disabled=sceneIndex===scenes.length-1&&step===s.steps-1;$('sceneSelect').value=sceneIndex;$('slide').dataset.scene=s.id;$('slide').dataset.step=step;$('legend').innerHTML=sceneIndex===0&&step<2?'':`<span class="value">value / observation</span>${sceneIndex>0||step>=3?'<span class="weight">probability / proportion</span>':''}${sceneIndex>0?'<span class="mean">model mean</span>':''}${sceneIndex>=9?'<span class="dev">deviation / square</span>':''}`;document.body.classList.toggle('static',staticMode);$('motion').textContent=staticMode?'Motion off':'Motion on';$('motion').setAttribute('aria-pressed',String(staticMode));history.replaceState(null,'',`#${s.id}:${step+1}`);const paint=t=>{$('diagram').innerHTML=drawState(tween(from,to,t),t,from)};if(animate&&!staticMode){const start=performance.now();const tick=now=>{const t=Math.min(1,(now-start)/850);paint(1-(1-t)**3);if(t<1)frame=requestAnimationFrame(tick)};paint(0);frame=requestAnimationFrame(tick)}else paint(1);lastState=to;lastParts=h.parts.slice();lastScene=s.id;}
function next(){if(step<scenes[sceneIndex].steps-1)step++;else if(sceneIndex<scenes.length-1){sceneIndex++;step=0}else return;render()}
function back(){if(step>0)step--;else if(sceneIndex>0){sceneIndex--;step=scenes[sceneIndex].steps-1}else return;render(false)}
function toggleNotes(){const show=$('notes').hidden;$('notes').hidden=!show;$('noteButton').setAttribute('aria-expanded',String(show))}
function toggleMotion(){staticMode=!staticMode;render(false)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
$('sceneSelect').innerHTML=scenes.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join('');$('sceneSelect').addEventListener('change',e=>{sceneIndex=Number(e.target.value);step=0;render(false)});$('next').onclick=next;$('back').onclick=back;$('noteButton').onclick=toggleNotes;$('motion').onclick=toggleMotion;$('full').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea')||(e.key===' '&&e.target.matches('button')))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='m')toggleMotion();else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key==='Home'){sceneIndex=0;step=0;render(false)}else if(e.key==='End'){sceneIndex=scenes.length-1;step=scenes[sceneIndex].steps-1;render(false)}});
const saved=location.hash.slice(1).split(':'),savedIndex=scenes.findIndex(s=>s.id===saved[0]);if(savedIndex>=0){sceneIndex=savedIndex;step=Math.max(0,Math.min(scenes[sceneIndex].steps-1,(parseInt(saved[1],10)||1)-1))}window.addEventListener('resize',resize);resize();render(false);
window.lecture={scenes,total,coins,averages,mean,variance,go:(i,j=0)=>{sceneIndex=Math.max(0,Math.min(scenes.length-1,i));step=Math.max(0,Math.min(scenes[sceneIndex].steps-1,j));render(false)},next,back,static:()=>{staticMode=true;render(false)}};
</script>
