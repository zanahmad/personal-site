const $=id=>document.getElementById(id),mean=(x,p)=>x.reduce((s,v,i)=>s+v*p[i],0),variance=(x,p)=>{const m=mean(x,p);return x.reduce((s,v,i)=>s+(v-m)**2*p[i],0)},fmt=(x,d=3)=>Number(x.toFixed(d)).toString(),lerp=(a,b,t)=>a+(b-a)*t;

function drawCoin(s,progress,old){let phase=s.phase,b='';const coin=(x,y,label,r=69)=>circ(x,y,r,'#173a50')+`<circle cx="${x}" cy="${y}" r="${r-8}" fill="none" stroke="${C.blue}" stroke-width="3"/>`+txt(x,y+13,label,C.blue,40);if(phase===0)return coin(410,210,'H')+txt(410,337,'Flip one fair coin.',C.ink,29);if(phase<4){const split=old&&old.kind==='coin'&&old.phase===0?progress:1;b+=coin(lerp(410,225,split),210,'T')+`<g opacity="${split}">${coin(lerp(410,595,split),210,'H')}</g>`;if(phase>=2)b+=txt(225,335,'tails: X = 0',C.blue,30)+txt(595,335,'heads: X = 1',C.blue,30);else b+=txt(225,335,'tails',C.ink,29)+txt(595,335,'heads',C.ink,29);if(phase>=3)b+=txt(225,105,'P(X = 0) = 1/2',C.teal,27)+txt(595,105,'P(X = 1) = 1/2',C.teal,27);return b;}const t=old&&old.kind==='coin'&&old.phase<4?progress:1;const ms=mass([0,1],[.5,.5],{min:-.5,max:1.5,showMean:false,labels:['1/2','1/2'],top:'Place each outcome at its numerical value'});b+=`<g opacity="${t}">${drawMass(ms)}</g>`;b+=`<g opacity="${1-t}">${coin(lerp(225,237.5,t),lerp(210,245,t),'0',lerp(69,25,t))}${coin(lerp(595,582.5,t),lerp(210,245,t),'1',lerp(69,25,t))}</g>`;return b;}

function drawTable(s){const count=s.rows[0].values.length,left=180,width=590,dx=width/count;let b=txt(410,36,s.top||'Keep the example in view',C.ink,26);s.rows.forEach((row,j)=>{const y=113+j*(s.spacing||79);b+=txt(28,y,row.label,row.color||C.ink,22,'start');row.values.forEach((x,i)=>{const active=s.focus===undefined||s.focus===i,xx=left+dx*(i+.5);if(j===s.markRow)b+=rect(xx-dx*.44,y-32,dx*.88,48,'#173a50');b+=txt(xx,y,x,active?(row.color||C.ink):C.muted,27)});if(j<s.rows.length-1)b+=line(24,y+27,790,y+27,C.line,1);});if(s.bottom)b+=txt(410,454,s.bottom,C.muted,23);return b;}
function drawData(s,progress,old){const xs=[1,1,2,3,3],group=s.group;let b=txt(410,40,'Our five observations: 1, 1, 2, 3, 3',C.ink,26);xs.forEach((x,i)=>{const gx=180+(x-1)*230,gy=(i===1||i===4)?228:142;const t=group?(old&&old.kind==='data'&&!old.group?progress:1):0;const xx=lerp(90+i*160,gx,t),yy=lerp(166,gy,t);b+=circ(xx,yy,31,'#173a50')+txt(xx,yy+10,x,C.blue,29);});if(group)b+=txt(180,320,'2 / 5',C.teal,28)+txt(410,320,'1 / 5',C.teal,28)+txt(640,320,'2 / 5',C.teal,28)+txt(410,382,'observed proportions',C.teal,23);else b+=txt(410,320,'Each observation gets weight 1/5.',C.teal,26);return b;}

function tween(old,to,t){if(!old||old.kind!==to.kind)return to;if(to.kind==='mass'&&old.x.length===to.x.length)return {...to,x:to.x.map((x,i)=>lerp(old.x[i],x,t)),p:to.p.map((p,i)=>lerp(old.p[i],p,t)),mu:lerp(old.mu,to.mu,t),min:lerp(old.min,to.min,t),max:lerp(old.max,to.max,t)};if(to.kind==='run')return {...to,n:Math.max(1,Math.round(lerp(old.n,to.n,t)))};return to;}
const coinMass=opts=>mass([0,1],[.5,.5],{min:-.5,max:1.5,labels:['1/2','1/2'],muLabel:'1/2',...opts});
const dieMass=opts=>mass(dieX,fair,{max:7,labels:pFair,...opts});
const dieTable=(extra=[],opts={})=>({kind:'table',rows:[{label:'value x',values:dieX,color:C.blue},{label:'P(X = x)',values:pFair,color:C.teal},...extra],...opts});
const H=(caption,diagram,parts,take,notes=caption)=>({caption,diagram,parts,take,notes});
const scenes=[];function scene(id,title,holds){scenes.push({id,title,holds,steps:holds.length})}
scene('coin','Start with one coin',[
H('One experiment. Two possible outcomes.',{kind:'coin',phase:0},[hint('Before calculating anything, name what could happen.')],'What can one flip produce?'),
H('The coin can land tails or heads.',{kind:'coin',phase:1},[hint('These are outcomes. We have not assigned numbers yet.')],'Keep this same coin in mind.'),
H('Define X as the number of heads in one fair coin flip.',{kind:'coin',phase:2},[eq(`${v('tails: X = 0')}<br>${v('heads: X = 1')}`),hint('X = 0 for tails; X = 1 for heads.')],'A random variable assigns a number to an outcome.'),
H('A fair coin gives the two values equal probability.',{kind:'coin',phase:3},[eq(`P(X = ${v(0)}) = ${w(frac(1,2))}<br>P(X = ${v(1)}) = ${w(frac(1,2))}`)],'The two probability weights add to 1.'),
H('Move those same values and weights onto a number line.',{kind:'coin',phase:4},[hint('The horizontal position is a possible value x.'),hint('The bar height is P(X = x).')],'Even the value 0 carries probability mass.')]);
scene('coinmean','Where does this coin balance?',[

H('Equal masses balance halfway between 0 and 1.',coinMass(),[eq(m('balance point = ½'))],'One flip is 0 or 1; the balance point can be between them.'),
H('Let the first value contribute in proportion to its weight.',coinMass({focus:0}),[eq(`${role('0','value','value')} × ${role(frac(1,2),'probability','weight')} = 0`)],'Multiply the value by the probability at that value.'),
H('Add the contribution from the other possible value.',coinMass({focus:1}),[eq(`${term(0,frac(1,2))}`),eq(`+ ${term(1,frac(1,2))}`)],'Both outcomes contribute to the same weighted average.'),
H('The weighted sum finds the balance point.',coinMass(),[eq(`${term(0,frac(1,2))} + ${term(1,frac(1,2))}`),eq(`= ${m(frac(1,2))}`),hint(`${m('E[X]')} and ${m('μ')} are names for this mean.`)],'Expectation is the mean of the probability distribution.')]);

scene('balance','The same idea, now with three values',[
H('Keep the number line. Place probability at 1, 3 and 5.',mass([1,3,5],[.25,.5,.25],{labels:['1/4','1/2','1/4'],showMean:false}),[eq(`P(X = ${v(1)}) = ${w(frac(1,4))}<br>P(X = ${v(3)}) = ${w(frac(1,2))}<br>P(X = ${v(5)}) = ${w(frac(1,4))}`)],'Predict the balance point using symmetry.'),
H('The equal outer masses balance around 3.',mass([1,3,5],[.25,.5,.25],{labels:['1/4','1/2','1/4']}),[sumterms([1,3,5],[frac(1,4),frac(1,2),frac(1,4)]),eq(`= ${m(3)}`)],'Each term still means value × probability.'),
H('Move probability toward 5 while keeping the values fixed.',mass([1,3,5],[.125,.25,.625],{labels:['1/8','1/4','5/8']}),[eq(`P(X = ${v(1)}) = ${w(frac(1,8))}<br>P(X = ${v(3)}) = ${w(frac(1,4))}<br>P(X = ${v(5)}) = ${w(frac(5,8))}`)],'Changing the probabilities can change the mean.'),
H('Use the new probabilities in the same calculation.',mass([1,3,5],[.125,.25,.625],{labels:['1/8','1/4','5/8']}),[sumterms([1,3,5],[frac(1,8),frac(1,4),frac(5,8)]),eq(`= ${m(4)}`)],'This is a weighted average, just like our coin.')]);

H('Include the other five contributions.',dieMass(),[sumterms(dieX,F6),eq(`= ${m('3.5')}`)],'Every value has the same probability, so this is an ordinary average.'),

let sceneIndex=0,step=0,frame=0,lastState=null,lastParts=[],lastScene='';let staticMode=matchMedia('(prefers-reduced-motion: reduce)').matches;const counts=scenes.map(s=>s.steps),total=counts.reduce((a,b)=>a+b,0);

function variableContext(id,step){
 const coin='X = number of heads in one fair coin flip (0 for tails, 1 for heads).';
 const die='X = number showing on one roll of a die (1, 2, 3, 4, 5 or 6).';
 if(id==='coin')return step<2?'Experiment: flip one fair coin; the outcomes are tails and heads.':coin;
 if(id==='coinmean')return coin;
 if(id==='experiments')return 'Xᵢ = number of heads on flip i; xᵢ is its observed value (0 or 1).';
 if(id==='balance')return 'X = the numerical outcome of this experiment; possible values are 1, 3 and 5.';
 if(id==='dice'||id==='expectation')return die;
 if(id==='transform')return step!==4?'X = face value of a fair die; define Y = X², its square.':'X = face value of a fair die; define Y = g(X), a chosen function of X.';
 if(id==='chapter1'||id==='datavariance')return 'Observed data: x₁, …, x₅ = 1, 1, 2, 3, 3. These are recorded values; n = 5.';
 if(id==='spread')return step===0?'X takes the values 2 and 4, with P(X = 2) = P(X = 4) = ½.':'Now X takes 1 and 5, with P(X = 1) = P(X = 5) = ½.';
 if(['deviations','variance','shortcut'].includes(id))return 'X = face value of a fair die; P(X = x) = 1/6 for x = 1, 2, 3, 4, 5, 6.';
 if(id==='shift')return step===0?die:step<3?'X = face value of a fair die; define Y = X + 2.':'X = face value of a fair die; define Y = 2X + 2.';
 if(id==='affineproof')return 'X = face value of a fair die; Y = aX + b, with fixed a and b. Picture: a = b = 2.';
 if(id==='linearity'||id==='sums')return 'X = heads on the first fair flip; Y = heads on the second. Each is 0 or 1; flips are independent.';
 if(id==='check'){const q=Math.floor(step/2);return q===0||q===3?coin:q===1?'X = face value of a fair die; define Y = −2X + 5.':'X = heads on the first flip; Y = heads on the second. The rule also allows dependence.';}
 return '';
}

document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea')||(e.key===' '&&e.target.matches('button')))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='m')toggleMotion();else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key==='Home'){sceneIndex=0;step=0;render(false)}else if(e.key==='End'){sceneIndex=scenes.length-1;step=scenes[sceneIndex].steps-1;render(false)}});
const saved=location.hash.slice(1).split(':'),savedIndex=scenes.findIndex(s=>s.id===saved[0]);if(savedIndex>=0){sceneIndex=savedIndex;step=Math.max(0,Math.min(scenes[sceneIndex].steps-1,(parseInt(saved[1],10)||1)-1))}window.addEventListener('resize',resize);resize();render(false);
window.lecture={scenes,total,coins,averages,mean,variance,go:(i,j=0)=>{sceneIndex=Math.max(0,Math.min(scenes.length-1,i));step=Math.max(0,Math.min(scenes[sceneIndex].steps-1,j));render(false)},next,back,static:()=>{staticMode=true;render(false)}};
</script>
</body>
