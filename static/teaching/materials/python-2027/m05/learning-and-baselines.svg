 <ns0:title id="figure-title">Training curve and held-out synthetic benchmark</ns0:title><ns0:desc id="figure-description">Left: mean training cross-entropy decreases over 160 epochs. Right: held-out accuracy of a constant baseline, a fixed-filter rule and the trained MLP. The simple fixed-filter rule can solve this controlled problem without learned image filters; no clinical or general image-recognition claim is implied.</ns0:desc><ns0:metadata>
