 <ns0:desc id="figure-description">Original schematic shows unchanged actin and myosin filament lengths with increased overlap. A separate prescribed curve u=(1-f)/(1+3f) decreases from one at zero load to zero at unit load; it illustrates a fixed-activation muscle trend and is not a fitted cardiac contraction model.</ns0:desc><ns0:title id="figure-title">Sliding filaments and a normalized load-speed cartoon</ns0:title><ns0:metadata>
