 <ns0:desc id="figure-description">Counterclockwise loop: fill from 50 to 120 mL at 10 mmHg; raise pressure at fixed volume to 100; eject to 50 mL at 100; relax at fixed volume to 10. The shaded net work area is 6300 mmHg mL, about 0.840 J. Valve labels are idealizations; real loops are curved.</ns0:desc><ns0:title id="figure-title">Four phases of an idealized pressure-volume loop</ns0:title><ns0:metadata>
