 <title id="network-title">Adult circulation as a directed network</title><desc id="network-desc">Follow the closed route: body tissues, systemic veins and venae cavae, right atrium, tricuspid valve, right ventricle, pulmonary valve and arteries, lungs, pulmonary veins, left atrium, mitral valve, left ventricle, aortic valve, aorta and systemic arteries, body tissue capillaries. Four heart chambers are named. Labels indicate lower or higher oxygen; colors are a diagram key, not literal blood colors. Arterioles and venules are included in the connecting vessels rather than shown as separate nodes. The drawing does not specify anatomic placement, geometry, pressure, or timing.</desc><title>Adult circulation as a directed network</title>
