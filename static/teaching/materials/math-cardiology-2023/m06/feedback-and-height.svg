 <ns0:desc id="figure-description">The controller subtracts measured pressure from target, updates rate, and uses fixed stroke volume and resistance to produce next pressure. The distinct static column has lower pressure above and higher pressure below a reference; at half a meter the difference is about 39 mmHg. Height is not used in the controller.</ns0:desc><ns0:title id="figure-title">Discrete feedback and a separate hydrostatic column</ns0:title><ns0:metadata>
