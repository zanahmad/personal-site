 <ns0:desc id="figure-description">At time zero resistance has dropped; no correction occurs before the initial measurement. With R 10 the fixed-rate pressure is 65, while the controller approaches 95 and rate 90. With R 4 the rate saturates at 160 and pressure at 69. Stroke volume is fixed at 100 mL/beat; these are synthetic recurrence outputs.</ns0:desc><ns0:title id="figure-title">Fixed-rate and feedback pressure responses</ns0:title><ns0:metadata>
