 <ns0:desc id="figure-description">Foramen ovale connects right and left atria. Ductus arteriosus connects pulmonary artery to aorta; the chosen positive direction is pulmonary to aortic. Lungs receive a nonzero branch flow. Right and left ventricles are grouped with their arterial outlets; body and placenta are grouped. Umbilical vessels and ductus venosus are discussed in notes but not separately resolved. The graph is not anatomical geometry.</ns0:desc><ns0:title id="figure-title">Grouped fetal circulation routes</ns0:title><ns0:metadata>
