 <ns0:desc id="figure-description">Ductus resistance 0.1 mmHg min/mL permits signed flow; declared closure gives zero conductance. Foramen forward resistance 0.05 permits only right-to-left nonnegative flow, with zero for a reversed or zero pressure difference. Pressures are supplied, not solved. Zero flow does not establish anatomical closure.</ns0:desc><ns0:title id="figure-title">Local ductus and foramen surrogate laws</ns0:title><ns0:metadata>
