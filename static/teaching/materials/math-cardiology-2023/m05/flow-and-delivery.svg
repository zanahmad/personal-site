 <ns0:desc id="figure-description">QT 5 L/min, systemic resistance 15 mmHg min/L, return contents 200 and 120 mL oxygen/L. Reducing pulmonary resistance from 10 to 5 increases mixed content from 168 to 180 but lowers systemic flow from 2 to 1.25 and delivery from 336 to 225. Delivery is not consumption; no clinical optimum is established.</ns0:desc><ns0:title id="figure-title">Flow division and systemic oxygen delivery</ns0:title><ns0:metadata>
