 <ns0:desc id="figure-description">Original route graphs. Serial: right pump to lungs to left pump to body and return. Parallel: one common pump supplies lung and body branches, whose returns mix. The parallel model is not a Fontan circulation. Arrows are route conventions; blood is not blue.</ns0:desc><ns0:title id="figure-title">Serial and selected parallel circulation routes</ns0:title><ns0:metadata>
