 <ns0:title id="figure-title">Sensitivity to nearly redundant detector channels</ns0:title><ns0:desc id="figure-description">Identical small signal perturbations barely change the inferred concentrations for distinct channels but noticeably change both estimates for nearly redundant channels. Both solve residuals remain near machine precision.</ns0:desc><ns0:metadata>
