{{- $hasMath := or .Params.math (in .RawContent "$") (in .RawContent "\\(") (in .RawContent "\\[") (in .RawContent "\\begin{") -}}
{{- if $hasMath -}}
<link rel="stylesheet" href="{{ "vendor/katex/0.16.11/katex.min.css" | relURL }}">
<script defer src="{{ "vendor/katex/0.16.11/katex.min.js" | relURL }}"></script>
<script defer src="{{ "vendor/katex/0.16.11/auto-render.min.js" | relURL }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.querySelector('main');
  if (!main || typeof window.renderMathInElement !== 'function') return;
  // Support the theme's original inline-code math convention without touching code examples.
  main.querySelectorAll('code').forEach(function (code) {
    if (code.closest('pre') || code.children.length) return;
    var text = code.textContent.trim();
    if (/^\\\([\s\S]+\\\)$/.test(text) || /^\\\[[\s\S]+\\\]$/.test(text)) {
      code.replaceWith(document.createTextNode(text));
    }
  });
  window.renderMathInElement(main, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '\\(', right: '\\)', display: false},
      {left: '$', right: '$', display: false},
      {left: '\\begin{equation}', right: '\\end{equation}', display: true},
      {left: '\\begin{align}', right: '\\end{align}', display: true},
      {left: '\\begin{gather}', right: '\\end{gather}', display: true}
    ],
    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
    ignoredClasses: ['no-math', 'tex2jax_ignore'],
    throwOnError: false,
    trust: false,
    strict: 'warn',
    output: 'htmlAndMathml'
  });
  main.querySelectorAll('.katex-display').forEach(function (equation) {
    equation.tabIndex = 0;
    equation.setAttribute('role', 'group');
    equation.setAttribute('aria-label', 'Equation; scroll horizontally if needed');
  });
  main.dataset.mathRendered = 'true';
});
</script>
{{- end -}}
